<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard produktivitas dengan greeting personal, Pomodoro timer, to-do list, dan quick links">
    <meta name="author" content="To-Do Life Dashboard">
    <title>To-Do Life Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Error Container untuk Critical Errors -->
    <div id="error-container" style="display: none;"></div>

    <!-- Notification Container -->
    <div id="notification-container"></div>

    <!-- Main Dashboard -->
    <main class="dashboard">
        <!-- Header dengan Theme Toggle -->
        <header class="dashboard-header">
            <h1 class="dashboard-title">Life Dashboard</h1>
            <button id="theme-toggle" class="theme-toggle" aria-label="Ganti mode tampilan">
                <span class="theme-icon">Mode gelap</span>
            </button>
        </header>

        <!-- Greeting Section -->
        <section id="greeting-section" class="section greeting-section">
            <div class="greeting-container">
                <div class="time-display" id="time-display">--:--:--</div>
                <div class="date-display" id="date-display">Loading...</div>
                <div class="greeting-text">
                    <span class="greeting-message" id="greeting-message">Selamat Datang</span>
                    <span class="greeting-name" id="greeting-name" contenteditable="false" data-placeholder="klik untuk edit nama"></span>
                </div>
            </div>
        </section>

        <!-- Timer Section -->
        <section id="timer-section" class="section timer-section">
            <h2 class="section-title">Focus Timer</h2>
            <div class="timer-container">
                <div class="timer-display" id="timer-display">25:00</div>
                <div class="timer-controls">
                    <button id="timer-start" class="btn btn-primary">Start</button>
                    <button id="timer-stop" class="btn btn-secondary" disabled>Stop</button>
                    <button id="timer-reset" class="btn btn-secondary">Reset</button>
                </div>
                <div class="timer-settings">
                    <label for="timer-duration">Durasi (menit):</label>
                    <input type="number" id="timer-duration" min="1" max="120" value="25">
                </div>
            </div>
        </section>

        <!-- Todo Section -->
        <section id="todo-section" class="section todo-section">
            <h2 class="section-title">To-Do List</h2>
            <div class="todo-container">
                <div class="todo-input-group">
                    <input type="text" id="todo-input" class="todo-input" placeholder="Tambahkan task baru..." maxlength="500">
                    <button id="todo-add" class="btn btn-primary">Tambah</button>
                </div>
                <ul id="todo-list" class="todo-list">
                    <!-- Tasks will be rendered here -->
                </ul>
            </div>
        </section>

        <!-- Links Section -->
        <section id="links-section" class="section links-section">
            <h2 class="section-title">Quick Links</h2>
            <div class="links-container">
                <div class="links-input-group">
                    <input type="text" id="link-name" class="link-input" placeholder="Nama link...">
                    <input type="text" id="link-url" class="link-input" placeholder="URL (https://example.com)...">
                    <button id="link-add" class="btn btn-primary">Tambah</button>
                </div>
                <div id="links-grid" class="links-grid">
                    <!-- Links will be rendered here -->
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="dashboard-footer">
            <p>&copy; 2025 To-Do Life Dashboard</p>
        </footer>
    </main>

    <!-- JavaScript -->
    <script src="js/script.js"></script>
</body>
</html>
